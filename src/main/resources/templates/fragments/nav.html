<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <!-- ✅ BOOTSTRAP 4 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="nav">
    <div class="container">
        <a class="navbar-brand" href="/">🏨 Hotel App</a>

        <!-- ✅ BOOTSTRAP 4 TOGGLE -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">🏠 Strona główna</a>
                </li>

                <!-- ✅ PANEL ADMINISTRATORA - BOOTSTRAP 4 -->
                <li sec:authorize="hasRole('ADMIN')" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="adminDropdown"
                       role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        🛠️ Panel Administratora
                    </a>
                    <!-- ✅ BOOTSTRAP 4 DROPDOWN -->
                    <div class="dropdown-menu">
                        <a class="dropdown-item" th:href="@{/admin/hotels}">🏨 Zarządzaj Hotelami</a>
                        <a class="dropdown-item" th:href="@{/admin/hotels/dashboard}">📊 Dashboard</a>
                        <a class="dropdown-item" th:href="@{/admin/users}">👥 Użytkownicy</a>
                        <a class="dropdown-item" th:href="@{/admin/reservations}">📋 Wszystkie Rezerwacje</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" th:href="@{/admin/emails/test}">📧 Test Email</a>
                    </div>
                </li>

                <!-- MENEDŻER -->
                <li th:if="${isHotelManager and !isAdmin}" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="managerDropdown"
                       role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        🏨 Panel Menedżera
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="/admin/hotels">🏨 Zarządzaj hotelami</a>
                        <a class="dropdown-item" href="/admin/hotels/admin/reservations">📋 Rezerwacje</a>
                    </div>
                </li>

                <!-- RECEPCJONISTA -->
                <li th:if="${canManageReservations and !isHotelManager and !isAdmin}" class="nav-item">
                    <a class="nav-link" href="/admin/hotels/admin/reservations">📋 Rezerwacje</a>
                </li>
            </ul>

            <!-- ✅ MENU UŻYTKOWNIKA - BOOTSTRAP 4 -->
            <ul class="navbar-nav">
                <li th:if="${currentUser != null}" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown"
                       role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        👤 <span th:text="${currentUser.username}">User</span>
                        <!-- ✅ BOOTSTRAP 4 BADGES -->
                        <span th:if="${currentUser.role != null}"
                              class="badge ml-1"
                              th:classappend="${isAdmin} ? 'badge-warning' : 'badge-info'"
                              th:text="${currentUser.role.description}">
                            Rola
                        </span>
                    </a>
                    <!-- ✅ BOOTSTRAP 4 DROPDOWN -->
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="/profile">👤 Profil</a>
                        <a class="dropdown-item" href="/my-reservations">📋 Moje rezerwacje</a>
                        <div class="dropdown-divider"></div>
                        <form action="/logout" method="post" style="display: inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="dropdown-item">🚪 Wyloguj</button>
                        </form>
                    </div>
                </li>

                <!-- NIEZALOGOWANI -->
                <li th:if="${currentUser == null}" class="nav-item">
                    <a class="nav-link" href="/login">🔑 Zaloguj się</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
