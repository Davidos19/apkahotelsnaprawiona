<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test systemu email</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-4">
    <h1>📧 Test systemu email</h1>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="close" data-dismiss="alert">
            <span>&times;</span>
        </button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="close" data-dismiss="alert">
            <span>&times;</span>
        </button>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">🧪 Wyślij email testowy</h5>

            <form th:action="@{/admin/emails/test/send}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="email">Email docelowy:</label>
                    <input type="email" id="email" name="email" class="form-control" required
                           placeholder="twoj-email@gmail.com">
                </div>

                <button type="submit" class="btn btn-primary">📧 Wyślij test email</button>
            </form>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">⚙️ Status systemu email</h5>
            <p>System email jest <span class="badge badge-success">AKTYWNY</span></p>
            <ul>
                <li>✅ Potwierdzenia rezerwacji</li>
                <li>✅ Anulowania rezerwacji</li>
                <li>✅ Przypomnienia check-in</li>
                <li>✅ Email powitalny</li>
            </ul>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
