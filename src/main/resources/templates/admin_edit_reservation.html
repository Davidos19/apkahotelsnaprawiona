
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edytuj Rezerwację</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    .auto-calculated {
      background-color: #e8f5e8;
      border-left: 3px solid #28a745;
    }
    .manually-edited {
      background-color: #fff3cd;
      border-left: 3px solid #ffc107;
    }
    .price-info {
      font-size: 0.9em;
      color: #6c757d;
    }
    .room-type-card {
      border: 1px solid #dee2e6;
      border-radius: 0.25rem;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .room-type-card:hover {
      border-color: #007bff;
      box-shadow: 0 2px 4px rgba(0,123,255,0.1);
    }
    .room-type-card.selected {
      border-color: #007bff;
      background-color: #e7f3ff;
    }
    .availability-badge {
      font-size: 0.8em;
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/admin_nav :: admin_nav}"></div>

<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <h1><i class="fas fa-edit"></i> Edytuj Rezerwację #<span th:text="${reservation.id}"></span></h1>

      <!-- Komunikaty -->
      <div th:if="${message}" class="alert alert-success">
        <span th:text="${message}"></span>
      </div>
      <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
      </div>

      <!-- ✅ FORMULARZ EDYCJI Z TYPAMI POKOI -->
      <form th:action="@{'/admin/reservations/' + ${reservation.id} + '/update'}"
            th:object="${reservation}"
            method="post">

        <div class="row">
          <div class="col-md-6">
            <!-- Status -->
            <div class="form-group">
              <label for="status">Status:</label>
              <select th:field="*{status}" id="status" class="form-control">
                <option value="PENDING">PENDING</option>
                <option value="CONFIRMED">CONFIRMED</option>
                <option value="CANCELLED">CANCELLED</option>
                <option value="COMPLETED">COMPLETED</option>
              </select>
            </div>

            <!-- Data przyjazdu -->
            <div class="form-group">
              <label for="checkIn">Data Przyjazdu:</label>
              <input type="date" th:field="*{checkIn}" id="checkIn" class="form-control" required>
            </div>

            <!-- Data wyjazdu -->
            <div class="form-group">
              <label for="checkOut">Data Wyjazdu:</label>
              <input type="date" th:field="*{checkOut}" id="checkOut" class="form-control" required>
            </div>
          </div>

          <div class="col-md-6">
            <!-- Hotel -->
            <div class="form-group">
              <label for="hotelId">Hotel:</label>
              <select th:field="*{hotelId}" id="hotelId" class="form-control" required>
                <option value="">-- Wybierz hotel --</option>
                <option th:each="hotel : ${hotels}"
                        th:value="${hotel.id}"
                        th:text="${hotel.name}"></option>
              </select>
            </div>

            <!-- ✅ UKRYTE POLE ROOM_ID -->
            <input type="hidden" th:field="*{roomId}" id="roomId">

            <!-- ✅ CENA Z AUTOMATYCZNYM OBLICZANIEM -->
            <div class="form-group">
              <label for="totalPrice">
                Cena Całkowita (zł):
                <i class="fas fa-info-circle"
                   title="Cena jest automatycznie obliczana na podstawie wybranego typu pokoju i długości pobytu."></i>
              </label>
              <input type="number" th:field="*{totalPrice}" id="totalPrice"
                     class="form-control auto-calculated" step="0.01" min="0">
              <div class="price-info mt-1">
                <span id="priceDetails">Wybierz typ pokoju, aby obliczyć cenę</span>
              </div>
            </div>
          </div>
        </div>

        <!-- ✅ SEKCJA WYBORU TYPU POKOJU -->
        <div class="row">
          <div class="col-12">
            <div class="form-group">
              <label><i class="fas fa-bed"></i> Wybierz Typ Pokoju:</label>
              <div id="roomTypeContainer" class="mt-2">
                <div class="text-center text-muted py-3">
                  <i class="fas fa-spinner fa-spin"></i> Wybierz hotel, aby zobaczyć dostępne typy pokoi
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ✅ PRZYCISKI AKCJI -->
        <div class="row mt-4">
          <div class="col-md-12">
            <div class="text-center">
              <button type="submit" class="btn btn-success btn-lg mr-3">
                <i class="fas fa-save"></i> ZAPISZ ZMIANY
              </button>

              <a th:href="@{'/admin/reservations/' + ${reservation.id}}"
                 class="btn btn-info btn-lg mr-3">
                <i class="fas fa-eye"></i> Podgląd
              </a>

              <a th:href="@{/admin/reservations}" class="btn btn-secondary btn-lg">
                <i class="fas fa-arrow-left"></i> Powrót
              </a>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let manuallyEditedPrice = false;
  let selectedRoomType = null;

  // ✅ FUNKCJA OBLICZAJĄCA CENĘ NA PODSTAWIE TYPU POKOJU
  function calculateTotalPrice() {
    const checkIn = $('#checkIn').val();
    const checkOut = $('#checkOut').val();

    if (checkIn && checkOut && selectedRoomType) {
      const startDate = new Date(checkIn);
      const endDate = new Date(checkOut);
      const timeDiff = endDate.getTime() - startDate.getTime();
      const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));

      if (daysDiff > 0) {
        const avgPrice = selectedRoomType.avgPrice || selectedRoomType.minPrice || 0;
        const totalPrice = daysDiff * avgPrice;

        if (!manuallyEditedPrice) {
          $('#totalPrice').val(totalPrice.toFixed(2));
          $('#totalPrice').removeClass('manually-edited').addClass('auto-calculated');
        }

        $('#priceDetails').html(
                `<i class="fas fa-calculator"></i> ${daysDiff} dni × ${avgPrice.toFixed(2)} zł = <strong>${totalPrice.toFixed(2)} zł</strong>`
        );

        return totalPrice;
      }
    }

    $('#priceDetails').text('Wybierz typ pokoju i daty, aby obliczyć cenę');
    return 0;
  }

  // ✅ ŁADOWANIE TYPÓW POKOI
  function loadRoomTypes(hotelId) {
    const container = $('#roomTypeContainer');

    if (!hotelId) {
      container.html('<div class="text-center text-muted py-3">Wybierz hotel, aby zobaczyć dostępne typy pokoi</div>');
      return;
    }

    container.html('<div class="text-center py-3"><i class="fas fa-spinner fa-spin"></i> Ładowanie typów pokoi...</div>');

    const checkIn = $('#checkIn').val();
    const checkOut = $('#checkOut').val();

    $.ajax({
      url: '/admin/reservations/room-types-by-hotel',
      type: 'GET',
      data: {
        hotelId: hotelId,
        checkIn: checkIn,
        checkOut: checkOut
      },
      success: function(roomTypes) {
        if (roomTypes && roomTypes.length > 0) {
          let html = '<div class="row">';

          roomTypes.forEach(function(roomType) {
            const isAvailable = roomType.availableRooms > 0;
            const availabilityClass = isAvailable ? 'badge-success' : 'badge-danger';
            const cardClass = isAvailable ? '' : 'disabled';

            html += `
                            <div class="col-md-6 col-lg-4">
                                <div class="room-type-card p-3 ${cardClass}"
                                     data-room-type='${JSON.stringify(roomType)}'
                                     onclick="${isAvailable ? 'selectRoomType(this)' : 'void(0)'}">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h6 class="mb-0">
                                            <i class="fas fa-bed"></i> ${roomType.roomType}
                                        </h6>
                                        <span class="badge availability-badge ${availabilityClass}">
                                            ${roomType.availableRooms} dostępnych
                                        </span>
                                    </div>
                                    <p class="mb-2 text-muted">
                                        <i class="fas fa-users"></i> ${roomType.capacity} osoby
                                    </p>
                                    <div class="price-info">
                                        <strong>${roomType.avgPrice.toFixed(2)} zł</strong> / noc
                                        ${roomType.minPrice !== roomType.maxPrice ?
                    `<br><small class="text-muted">(${roomType.minPrice.toFixed(2)} - ${roomType.maxPrice.toFixed(2)} zł)</small>`
                    : ''
            }
                                    </div>
                                    ${!isAvailable ? '<div class="text-danger mt-2"><small>Brak dostępności w wybranym terminie</small></div>' : ''}
                                </div>
                            </div>
                        `;
          });

          html += '</div>';
          container.html(html);
        } else {
          container.html('<div class="text-center text-muted py-3">Brak dostępnych typów pokoi w tym hotelu</div>');
        }
      },
      error: function() {
        container.html('<div class="text-center text-danger py-3">Błąd podczas ładowania typów pokoi</div>');
      }
    });
  }

  // ✅ WYBIERANIE TYPU POKOJU
  function selectRoomType(element) {
    // Usuń zaznaczenie z innych kart
    $('.room-type-card').removeClass('selected');

    // Zaznacz wybraną kartę
    $(element).addClass('selected');

    // Pobierz dane typu pokoju
    selectedRoomType = JSON.parse($(element).attr('data-room-type'));

    // Ustaw ukryte pole roomId na "TYPE:{roomType}_{capacity}"
    $('#roomId').val(`TYPE:${selectedRoomType.roomType}_${selectedRoomType.capacity}`);

    // Przelicz cenę
    calculateTotalPrice();
  }

  $(document).ready(function() {

    // Załaduj typy pokoi przy zmianie hotelu
    $('#hotelId').on('change', function() {
      const hotelId = $(this).val();
      selectedRoomType = null;
      $('#roomId').val('');
      loadRoomTypes(hotelId);
    });

    // ✅ OBLICZ CENĘ PO ZMIANIE DAT
    $('#checkIn, #checkOut').on('change', function() {
      const hotelId = $('#hotelId').val();
      if (hotelId) {
        loadRoomTypes(hotelId); // Przeładuj typy pokoi z nową dostępnością
      }
      calculateTotalPrice();
    });

    // ✅ OZNACZ CENĘ JAKO RĘCZNIE EDYTOWANĄ
    $('#totalPrice').on('input', function() {
      manuallyEditedPrice = true;
      $(this).removeClass('auto-calculated').addClass('manually-edited');
      $('#priceDetails').html(
              '<i class="fas fa-edit"></i> <strong>Cena edytowana ręcznie</strong> - automatyczne obliczanie wyłączone'
      );
    });

    // ✅ PRZYCISK RESETOWANIA DO AUTOMATYCZNEJ CENY
    $('#totalPrice').after(
            '<button type="button" class="btn btn-sm btn-outline-secondary ml-2" id="resetPrice" title="Przywróć automatyczne obliczanie">' +
            '<i class="fas fa-undo"></i> Auto' +
            '</button>'
    );

    $('#resetPrice').on('click', function() {
      manuallyEditedPrice = false;
      calculateTotalPrice();
    });

    // Walidacja dat
    $('#checkIn').on('change', function() {
      const checkIn = this.value;
      const checkOut = $('#checkOut');

      if (checkIn) {
        checkOut.prop('min', checkIn);

        if (checkOut.val() && checkOut.val() <= checkIn) {
          checkOut.val('');
        }
      }
    });

    // Załaduj typy pokoi jeśli hotel już wybrany
    const initialHotelId = $('#hotelId').val();
    if (initialHotelId) {
      loadRoomTypes(initialHotelId);
    }
  });
</script>
</body>
</html>
